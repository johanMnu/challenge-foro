name: Verificar arranque de ForoHub

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: forohub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Probar contexto Spring Boot y migraciones con MySQL
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/forohub
          DB_USERNAME: root
          DB_PASSWORD: test_password
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode test
